<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Veltrixo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1E1E2D;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            width: 56px; height: 56px;
            background: #6366f1;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; font-weight: 800;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        p  { color: rgba(255,255,255,0.5); font-size: 0.95rem; line-height: 1.6; max-width: 320px; margin: 0 auto 2rem; }
        .btn {
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #4f46e5; }
        .note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="logo">V</div>
    <h1>You're offline</h1>
    <p>No internet connection detected. Your cached deliveries are still available — connect to sync updates.</p>
    <a href="javascript:window.location.reload()" class="btn">Retry Connection</a>
    <p class="note">Delivery status updates will sync automatically when you're back online.</p>
</body>
</html>
